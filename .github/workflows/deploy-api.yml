# CI: pytest (unit + functional), then deploy API image to Artifact Registry + Cloud Run.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   GCP_SA_KEY      — service account JSON (Artifact Registry Writer, Cloud Run Admin,
#                     Service Account User)
#   GEMINI_API_KEY  — injected into Cloud Run on each deploy
#   GCP_PROJECT_ID  — Google Cloud project id
#
# Optional repository secrets (sensible defaults for this repo):
#   GCP_REGION, AR_REPOSITORY, IMAGE_NAME, CLOUD_RUN_SERVICE

name: CI and Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'src/**'
      - 'tests/**'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/deploy-api.yml'
      - '.pre-commit-config.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit and functional tests
        run: pytest -m "unit or functional" -p no:cacheprovider

      - name: Run integration tests
        run: pytest -m integration -p no:cacheprovider

  deploy:
    name: Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION || 'us-west1' }}
      AR_REPOSITORY: ${{ secrets.AR_REPOSITORY || 'prolific-bias-audit' }}
      IMAGE_NAME: ${{ secrets.IMAGE_NAME || 'prolific-bias-audit-api' }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE || 'prolific-bias-audit-api' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::GCP_SA_KEY is missing or empty."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing or empty."
            exit 1
          fi
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::GCP_PROJECT_ID is missing or empty."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE_BASE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}
        run: |
          IMAGE_TAG="${IMAGE_BASE}:${{ github.sha }}"
          docker build -f api/Dockerfile -t "${IMAGE_TAG}" -t "${IMAGE_BASE}:latest" .
          docker push "${IMAGE_TAG}"
          docker push "${IMAGE_BASE}:latest"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --image "${IMAGE}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --update-env-vars "GEMINI_API_KEY=${GEMINI_API_KEY}" \
            --quiet
